    <rect x="1055" y="340" width="114" height="30" rx="15" fill="#EFF8D8"/><text x="1075" y="360" fill="#547D0C" font-size="12" font-weight="700">NEW RECORD</text><text x="1200" y="361" fill="#6B7280" font-size="13">Review</text>
