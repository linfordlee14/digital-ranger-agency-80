  <circle cx="102" cy="218" r="7" fill="#A3E635"/><text x="121" y="224" fill="#fff" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="700">Discovery records</text>
  <text x="88" y="289" fill="#AAB7C7" font-family="Aptos, Arial, sans-serif" font-size="14">Assessment notes</text>
  <text x="88" y="335" fill="#AAB7C7" font-family="Aptos, Arial, sans-serif" font-size="14">Draft generation</text>
  <text x="88" y="381" fill="#AAB7C7" font-family="Aptos, Arial, sans-serif" font-size="14">Suppression (planned)</text>
  <path d="M88 777h168" stroke="#344153"/><text x="88" y="814" fill="#AAB7C7" font-family="Aptos, Arial, sans-serif" font-size="13">Illustrative data only</text>
  <text x="364" y="109" fill="#111827" font-family="Aptos Display, Arial, sans-serif" font-size="26" font-weight="700">Business discovery</text>
  <rect x="1142" y="78" width="198" height="40" rx="20" fill="#EAF3FD"/><text x="1162" y="104" fill="#0A6ED1" font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="700">PUBLIC-DATA REVIEW</text>
  <text x="364" y="195" fill="#6B7280" font-family="Aptos, Arial, sans-serif" font-size="15">Illustrative records. Human review is not enforced by the prototype.</text>
  <rect x="364" y="232" width="946" height="50" rx="10" fill="#F8FAFC" stroke="#E5E7EB"/>
  <text x="388" y="263" fill="#6B7280" font-family="Aptos, Arial, sans-serif" font-size="13">Search a category or area</text>
  <rect x="1116" y="243" width="170" height="28" rx="14" fill="#fff" stroke="#D9E4F1"/><text x="1134" y="262" fill="#0A6ED1" font-family="Aptos, Arial, sans-serif" font-size="12" font-weight="700">CONCEPT ONLY</text>
