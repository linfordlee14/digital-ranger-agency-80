<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual business discovery dashboard</title>
  <desc id="desc">An illustrative Linfy Beacon discovery dashboard with generic business categories, not live data or an implemented interface.</desc>
  <defs><filter id="dashShadow" x="0" y="0" width="1440" height="960" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#111827" flood-opacity=".10"/></filter></defs>
  <rect width="1440" height="960" rx="28" fill="#F3F4F6"/>
