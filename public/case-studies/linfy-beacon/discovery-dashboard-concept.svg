    <rect x="364" y="508" width="946" height="80" rx="12" fill="#fff" stroke="#E5E7EB"/>
    <circle cx="404" cy="548" r="18" fill="#F3F4F6"/><path d="M394 548h20M404 538v20" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
    <text x="448" y="540" fill="#111827" font-size="16" font-weight="700">Hospitality venue</text><text x="448" y="564" fill="#6B7280" font-size="13">Category: accommodation · Source: public map data</text>
    <rect x="1055" y="532" width="114" height="30" rx="15" fill="#F3F4F6"/><text x="1075" y="552" fill="#6B7280" font-size="12" font-weight="700">PENDING</text><text x="1200" y="553" fill="#6B7280" font-size="13">Review</text>
  </g>
  <rect x="364" y="636" width="946" height="192" rx="16" fill="#F8FAFC" stroke="#E5E7EB"/>
  <text x="394" y="678" fill="#111827" font-family="Aptos Display, Arial, sans-serif" font-size="18" font-weight="700">Review principles</text>
  <path d="M395 714h10l7 9 13-18" stroke="#0A6ED1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="724" fill="#374151" font-family="Aptos, Arial, sans-serif" font-size="14">Use public business information only.</text>
  <path d="M395 754h10l7 9 13-18" stroke="#0A6ED1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="764" fill="#374151" font-family="Aptos, Arial, sans-serif" font-size="14">Human review is recommended, but not enforced.</text>
  <path d="M395 794h10l7 9 13-18" stroke="#0A6ED1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="804" fill="#374151" font-family="Aptos, Arial, sans-serif" font-size="14">Do not treat this illustration as a record of actual leads.</text>
