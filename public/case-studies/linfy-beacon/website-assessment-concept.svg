<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual website assessment interface</title>
  <desc id="desc">An illustrative Linfy Beacon assessment showing generic website signals and a generated note; human review is recommended but not enforced.</desc>
  <defs><linearGradient id="assessGrad" x1="772" y1="280" x2="1174" y2="701" gradientUnits="userSpaceOnUse"><stop stop-color="#0A6ED1"/><stop offset="1" stop-color="#A3E635"/></linearGradient><filter id="assessShadow" x="0" y="0" width="1440" height="960" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#111827" flood-opacity=".10"/></filter></defs>
  <rect width="1440" height="960" rx="28" fill="#F3F4F6"/>
  <rect x="66" y="60" width="1308" height="840" rx="22" fill="#fff" filter="url(#assessShadow)"/>
  <rect x="66" y="60" width="1308" height="74" rx="22" fill="#111827"/><rect x="66" y="102" width="1308" height="32" fill="#111827"/>
  <circle cx="108" cy="97" r="7" fill="#FF7A2D"/><circle cx="132" cy="97" r="7" fill="#A3E635"/><circle cx="156" cy="97" r="7" fill="#72B7FF"/>
  <text x="200" y="104" fill="#fff" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="700">Linfy Beacon · conceptual assessment</text>
  <rect x="108" y="174" width="770" height="678" rx="16" fill="#F8FAFC" stroke="#E5E7EB"/>
  <text x="148" y="223" fill="#0A6ED1" font-family="Aptos, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">ILLUSTRATIVE REVIEW</text>
  <text x="148" y="264" fill="#111827" font-family="Aptos Display, Arial, sans-serif" font-size="29" font-weight="700">Example website signal review</text>
  <text x="148" y="294" fill="#6B7280" font-family="Aptos, Arial, sans-serif" font-size="15">Concept only. Signals require appropriate verification before outreach.</text>
  <rect x="148" y="336" width="690" height="138" rx="14" fill="#fff" stroke="#D9E4F1"/>
  <rect x="178" y="366" width="78" height="78" rx="12" fill="#EAF3FD"/><path d="M204 387h28v36h-28zM210 397h16M210 407h11" stroke="#0A6ED1" stroke-width="3" stroke-linecap="round"/>
  <text x="282" y="384" fill="#111827" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="700">Website review context</text>
  <text x="282" y="413" fill="#6B7280" font-family="Aptos, Arial, sans-serif" font-size="14">Public URL submitted for an assessment workflow.</text>
  <text x="282" y="439" fill="#6B7280" font-family="Aptos, Arial, sans-serif" font-size="14">No customer or contact record is shown in this illustration.</text>
  <text x="148" y="532" fill="#111827" font-family="Aptos Display, Arial, sans-serif" font-size="20" font-weight="700">Assessment signals</text>
  <g font-family="Aptos, Arial, sans-serif">
    <rect x="148" y="560" width="330" height="102" rx="14" fill="#fff" stroke="#E5E7EB"/><circle cx="184" cy="597" r="14" fill="#EAF3FD"/><path d="M177 597h14M184 590v14" stroke="#0A6ED1" stroke-width="2.5" stroke-linecap="round"/><text x="212" y="593" fill="#111827" font-size="15" font-weight="700">URL protocol signal</text><text x="212" y="619" fill="#6B7280" font-size="13">Certificate not checked</text>
    <rect x="508" y="560" width="330" height="102" rx="14" fill="#fff" stroke="#E5E7EB"/><circle cx="544" cy="597" r="14" fill="#FFF0E8"/><path d="M537 597h14M544 590v14" stroke="#C14E0B" stroke-width="2.5" stroke-linecap="round"/><text x="572" y="593" fill="#111827" font-size="15" font-weight="700">Mobile signal</text><text x="572" y="619" fill="#6B7280" font-size="13">Requires validation</text>
    <rect x="148" y="686" width="330" height="102" rx="14" fill="#fff" stroke="#E5E7EB"/><circle cx="184" cy="723" r="14" fill="#EAF3FD"/><path d="M177 723h14M184 716v14" stroke="#0A6ED1" stroke-width="2.5" stroke-linecap="round"/><text x="212" y="719" fill="#111827" font-size="15" font-weight="700">Content signal</text><text x="212" y="745" fill="#6B7280" font-size="13">Review site content</text>
    <rect x="508" y="686" width="330" height="102" rx="14" fill="#fff" stroke="#E5E7EB"/><circle cx="544" cy="723" r="14" fill="#F3F4F6"/><path d="M537 723h14" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/><text x="572" y="719" fill="#111827" font-size="15" font-weight="700">Review recommended</text><text x="572" y="745" fill="#6B7280" font-size="13">Not enforced by prototype</text>
  </g>
  <rect x="918" y="174" width="414" height="678" rx="16" fill="#111827"/>
  <text x="958" y="223" fill="#A3E635" font-family="Aptos, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">CONCEPTUAL OUTPUT</text>
  <text x="958" y="270" fill="#fff" font-family="Aptos Display, Arial, sans-serif" font-size="28" font-weight="700">Assessment note</text>
  <rect x="958" y="306" width="334" height="2" fill="url(#assessGrad)"/>
  <path d="M982 370h22M993 359v22" stroke="#72B7FF" stroke-width="3" stroke-linecap="round"/><text x="1028" y="375" fill="#fff" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="700">Signal summary</text>
  <text x="958" y="431" fill="#C7D2E0" font-family="Aptos, Arial, sans-serif" font-size="17">“A potential web-presence issue</text><text x="958" y="457" fill="#C7D2E0" font-family="Aptos, Arial, sans-serif" font-size="17">was identified for review.”</text>
  <rect x="958" y="516" width="334" height="112" rx="12" fill="#1F2937"/><text x="982" y="550" fill="#A3E635" font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="700">SAFE OPERATING BOUNDARY</text><text x="982" y="581" fill="#DCE5F0" font-family="Aptos, Arial, sans-serif" font-size="14">Do not use automated signals as</text><text x="982" y="603" fill="#DCE5F0" font-family="Aptos, Arial, sans-serif" font-size="14">unverified customer-facing claims.</text>
  <rect x="958" y="686" width="334" height="48" rx="24" fill="#A3E635"/><text x="1020" y="716" fill="#111827" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700">REVIEW RECOMMENDED</text>
</svg>
